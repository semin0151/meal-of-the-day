<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>오늘의 춘식도락</title>
<style>
:root {
  --bg: #f5f5f5;
  --card: #ffffff;
  --text: #333333;
  --text-sub: #666666;
  --text-muted: #888888;
  --border: #eeeeee;
  --shadow: rgba(0,0,0,0.10);
  --skeleton: #e9e9e9;
  --chip-bg: #eef1f4;
  --chip-text: #555555;
  --pill-bg: #fff0e6;
  --pill-text: #c77700;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1a1a1a;
    --card: #262626;
    --text: #eaeaea;
    --text-sub: #b3b3b3;
    --text-muted: #8a8a8a;
    --border: #3a3a3a;
    --shadow: rgba(0,0,0,0.45);
    --skeleton: #333333;
    --chip-bg: #353535;
    --chip-text: #cccccc;
    --pill-bg: #3a2e22;
    --pill-text: #e0a060;
  }
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif; padding: 20px; -webkit-text-size-adjust: 100%; }

header { text-align: center; margin-bottom: 20px; }
header h1 { font-size: 20px; color: var(--text); }
header .subtitle { margin-top: 6px; font-size: 14px; color: var(--text-muted); }

.grid { display: grid; grid-template-columns: 1fr; gap: 16px; max-width: 600px; margin: 0 auto; }
@media (min-width: 700px) {
  .grid { grid-template-columns: repeat(2, 1fr); max-width: 900px; }
}

.card { background: var(--card); border-radius: 12px; overflow: hidden; box-shadow: 0 1px 4px var(--shadow); }
.thumb { position: relative; width: 100%; aspect-ratio: 4 / 3; background: var(--skeleton); overflow: hidden; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; cursor: pointer; opacity: 0; transition: opacity 0.3s; }
.thumb img.loaded { opacity: 1; }
.thumb img:active { opacity: 0.85; }
.thumb.error::after { content: '이미지를 불러올 수 없습니다'; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--text-muted); font-size: 13px; }

.label { padding: 12px 16px; }
.header-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
.chip { font-size: 12px; font-weight: 700; color: var(--chip-text); background: var(--chip-bg); padding: 3px 9px; border-radius: 999px; }
.spicy { font-size: 13px; white-space: nowrap; margin-left: 4px; }

.name-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.name { font-size: 16px; font-weight: 600; color: var(--text); flex: 1; }
.kcal { font-size: 12px; color: var(--pill-text); background: var(--pill-bg); font-weight: 600; white-space: nowrap; padding: 3px 9px; border-radius: 999px; }
.detail { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border); display: flex; flex-direction: column; gap: 6px; }
.detail > div { font-size: 13px; color: var(--text-sub); line-height: 1.5; }
.empty { text-align: center; color: var(--text-muted); margin-top: 40px; font-size: 15px; grid-column: 1 / -1; }

.overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 100; justify-content: center; align-items: center; }
.overlay.active { display: flex; }
.overlay img { max-width: 95%; max-height: 95vh; object-fit: contain; }
</style>
</head>
<body>
<header>
  <h1 id="title"></h1>
  <p class="subtitle">춘식도락 점심</p>
</header>
<div class="grid" id="grid"></div>
<div class="overlay" id="overlay"><img id="overlay-img" alt=""></div>

<script>
const ALLOWED_IMAGE_HOSTS = ['eliga-order.kr.object.ncloudstorage.com'];
const WEEKDAYS = ['일', '월', '화', '수', '목', '금', '토'];

const grid = document.getElementById('grid');
const overlay = document.getElementById('overlay');
const overlayImg = document.getElementById('overlay-img');
const titleEl = document.getElementById('title');

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function isAllowedUrl(urlStr) {
  try {
    const u = new URL(urlStr);
    return u.protocol === 'https:' && ALLOWED_IMAGE_HOSTS.some(h => u.hostname === h);
  } catch { return false; }
}

// dt 파라미터(YYYY-MM-DD)가 있으면 그 날짜로, 없으면 오늘 날짜로 제목 구성
function renderTitle() {
  const dt = new URLSearchParams(location.search).get('dt');
  let d;
  if (dt && /^\d{4}-\d{2}-\d{2}$/.test(dt)) {
    const [y, m, day] = dt.split('-').map(Number);
    d = new Date(y, m - 1, day);
  } else {
    d = new Date();
  }
  titleEl.textContent =
    d.getFullYear() + '년 ' + (d.getMonth() + 1) + '월 ' + d.getDate() + '일(' + WEEKDAYS[d.getDay()] + ')';
}
renderTitle();

try {
  const raw = new URLSearchParams(location.search).get('data');
  if (!raw) throw new Error('no data');
  // URL-safe base64 → 표준 base64로 변환 후 디코딩
  var b64 = raw.replace(/-/g, '+').replace(/_/g, '/');
  while (b64.length % 4) b64 += '=';
  const items = JSON.parse(decodeURIComponent(escape(atob(b64))));

  if (!Array.isArray(items) || !items.length) throw new Error('empty');

  // 영양정보 키 → 라벨 (탄/단/지/나트륨)
  const NUTRI_KEYS = [['ca', '탄'], ['pr', '단'], ['fa', '지'], ['so', '나트륨']];

  items.forEach(item => {
    const imgUrl = item.i || item.image;
    const name = item.n || item.name || '';
    const category = item.c || item.category || '';
    const kcal = item.k || '';
    const dishes = Array.isArray(item.d) ? item.d : [];
    const origins = Array.isArray(item.og) ? item.og.filter(Boolean) : [];
    const spicy = item.s || 0;

    if (!imgUrl || !isAllowedUrl(imgUrl)) return;

    const card = document.createElement('div');
    card.className = 'card';

    const thumb = document.createElement('div');
    thumb.className = 'thumb';
    const img = document.createElement('img');
    img.src = imgUrl;
    img.alt = name;
    img.loading = 'lazy';
    img.onload = () => img.classList.add('loaded');
    img.onerror = () => { thumb.classList.add('error'); img.remove(); };
    img.onclick = () => { overlayImg.src = imgUrl; overlayImg.alt = name; overlay.classList.add('active'); };
    thumb.appendChild(img);

    const label = document.createElement('div');
    label.className = 'label';

    const categoryHtml = category ? '<span class="chip">' + esc(category) + '</span>' : '';
    const spicyHtml = spicy > 0 ? '<span class="spicy">' + '🌶'.repeat(Math.min(spicy, 5)) + '</span>' : '';
    const kcalHtml = kcal ? '<div class="kcal">' + esc(kcal) + '</div>' : '';

    const sides = dishes
      .filter(d => d && d.trim() !== name.trim())
      .map(d => esc(d.trim()));
    const dishesHtml = sides.length ? '<div class="dishes">🍱 ' + sides.join(', ') + '</div>' : '';

    const nutri = NUTRI_KEYS
      .filter(([k]) => item[k])
      .map(([k, label]) => esc(label + ' ' + item[k]));
    const nutriHtml = nutri.length ? '<div class="nutri">🥗 ' + nutri.join(' · ') + '</div>' : '';

    const originHtml = origins.length
      ? '<div class="origin">🌍 ' + origins.map(esc).join(', ') + '</div>' : '';

    const detailHtml = (dishesHtml || nutriHtml || originHtml)
      ? '<div class="detail">' + dishesHtml + nutriHtml + originHtml + '</div>' : '';

    label.innerHTML =
      '<div class="header-row">' + categoryHtml + '</div>' +
      '<div class="name-row"><div class="name">' + esc(name) + spicyHtml + '</div>' + kcalHtml + '</div>' +
      detailHtml;

    card.appendChild(thumb);
    card.appendChild(label);
    grid.appendChild(card);
  });

  if (!grid.children.length) throw new Error('no valid items');
} catch (e) {
  grid.innerHTML = '<p class="empty">메뉴 정보를 불러올 수 없습니다.</p>';
}

overlay.onclick = () => overlay.classList.remove('active');
</script>
</body>
</html>
